name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE 9.0.5
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure (Release, universal)
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DEPSILON_CHOP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine and processor tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (strictness 5)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            --validate "build/EpsilonChop_artefacts/Release/VST3/Epsilon Chop.vst3"

      - name: Package
        run: |
          mkdir -p dist
          cp -R "build/EpsilonChop_artefacts/Release/VST3/Epsilon Chop.vst3" dist/
          cp -R "build/EpsilonChop_artefacts/Release/AU/Epsilon Chop.component" dist/
          cp -R "build/EpsilonChop_artefacts/Release/Standalone/Epsilon Chop.app" dist/
          cat > dist/INSTALL.txt <<'TXT'
          Epsilon Chop v0.5.0

          1. Copy "Epsilon Chop.vst3" to ~/Library/Audio/Plug-Ins/VST3
             and "Epsilon Chop.component" to ~/Library/Audio/Plug-Ins/Components
          2. These builds are not notarised. Remove the download quarantine once in Terminal:
               xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"Epsilon Chop.vst3"
               xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/"Epsilon Chop.component"
          3. FL Studio: Options > Manage plugins > Find installed plugins, then add Epsilon Chop to the Channel Rack.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: Epsilon-Chop-macOS
          path: dist

  ios:
    # The iPhone app: builds the Projucer iOS project for a real iPhone (unsigned) and for the
    # simulator, then launches it in an iPhone simulator, checks it stays up, and screenshots it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE 9.0.5
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git JUCE
      - name: Build for iPhone (device, unsigned)
        run: |
          xcodebuild -project "Builds/iOS/Epsilon Chop.xcodeproj" -target "Epsilon Chop - Standalone Plugin" \
                     -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build for the iPhone simulator
        run: |
          xcodebuild -project "Builds/iOS/Epsilon Chop.xcodeproj" -target "Epsilon Chop - Standalone Plugin" \
                     -configuration Release -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Run it in an iPhone simulator
        run: |
          set -e
          # Projucer projects build into Builds/iOS/build/<config>; the simulator build ran last
          APP=$(find Builds/iOS/build -name "Epsilon Chop.app" -type d | head -1)
          test -n "$APP" || { echo "::error::no app was built"; exit 1; }
          echo "App: $APP"
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator: $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.epsilonsounds.chop
          sleep 12
          xcrun simctl spawn "$DEV" launchctl list | grep -i "epsilonsounds.chop" || { echo "::error::the app is not running after launch"; exit 1; }
          mkdir -p shots
          xcrun simctl io "$DEV" screenshot shots/iphone-simulator.png
          echo "### iPhone simulator" >> "$GITHUB_STEP_SUMMARY"
          echo "Launched and still running after 12 s." >> "$GITHUB_STEP_SUMMARY"
          # a small copy of the screenshot in the log, so it can be checked without downloading
          sips -Z 700 -s format jpeg -s formatOptions 70 shots/iphone-simulator.png --out shots/small.jpg >/dev/null
          base64 -i shots/small.jpg | tr -d '\n' | fold -w 4000 | sed 's/^/SHOT:/' 
      - uses: actions/upload-artifact@v4
        with:
          name: EpsilonChop-iPhone-simulator-screenshot
          path: shots
          retention-days: 30
